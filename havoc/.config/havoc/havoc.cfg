[child]
program=yash

[window]
opacity=255

margin=yes

decorations=auto

[terminal]
rows=16
columns=140

scrollback=1000

scroll to bottom on input=yes

[font]
size=24

path=/usr/local/share/fonts/iosevkaterm/IosevkaTermNerdFont-Regular.ttf

[bind]
C-S-c=copy
C-S-v=paste
C-S-r=reset
C-S-Delete=hard reset
C-S-j=scroll down
C-S-k=scroll up
C-S-Page_Down=scroll down page
C-S-Page_Up=scroll up page
C-S-End=scroll to bottom
C-S-Home=scroll to top
C-S-i=zoom in
C-S-o=zoom out

[colors]
foreground = #282828
background = #fbf1c7
color0  = #fbf1c7
color8  = #928374
color1  = #cc241d
color9  = #fb4934
color2  = #98971a
color10 = #b8bb26
color3  = #d79921
color11 = #fabd2f
color4  = #458588
color12 = #83a598
color5  = #b16286
color13 = #d3869b
color6  = #689d6a
color14 = #8ec07c
color7  = #7c6f64
color15 = #ebdbb2
