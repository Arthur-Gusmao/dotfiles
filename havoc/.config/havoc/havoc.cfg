[child]
program=oksh

[window]
opacity=255

margin=yes

decorations=auto

[terminal]
rows=16
columns=140

scrollback=1000

scroll to bottom on input=no

[font]
size=24

path=/usr/share/fonts/nerd-iosevka-term/IosevkaTermNerdFont-Regular.ttf

[bind]
C-S-c=copy
C-S-v=paste
C-S-r=reset
C-S-Delete=hard reset
C-S-j=scroll down
C-S-k=scroll up
C-S-Page_Down=scroll down page
C-S-Page_Up=scroll up page
C-S-End=scroll to bottom
C-S-Home=scroll to top

[colors]
foreground = #ebdbb2
background = #282828
color0  = #282828
color8  = #928374
color1  = #fb4934
color9  = #fb4934
color2  = #b8bb26
color10 = #b8bb26
color3  = #fabd2f
color11 = #fabd2f
color4  = #83a598
color12 = #83a598
color5  = #d3869b
color13 = #d3869b
color6  = #8ec07c
color14 = #8ec07c
color7  = #a89984
color15 = #ebdbb2
