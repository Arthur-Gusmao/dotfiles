[child]
program=ash

[window]
opacity=255

margin=yes

decorations=auto

[terminal]
rows=16
columns=140

scrollback=1000

scroll to bottom on input=no

[font]
size=24

path=/usr/share/fonts/nerd-iosevka-term/IosevkaTermNerdFont-Regular.ttf

[bind]
C-S-c=copy
C-S-v=paste
C-S-r=reset
C-S-Delete=hard reset
C-S-j=scroll down
C-S-k=scroll up
C-S-Page_Down=scroll down page
C-S-Page_Up=scroll up page
C-S-End=scroll to bottom
C-S-Home=scroll to top

[colors]
foreground = #e5e5e5
background = #000000
color0  = #000000
color8  = #7f7f7f
color1  = #cd0000
color9  = #ff0000
color2  = #00cd00
color10 = #00ff00
color3  = #cdcd00
color11 = #ffff00
color4  = #0000ee
color12 = #5c5cff
color5  = #cd00cd
color13 = #ff00ff
color6  = #00cdcd
color14 = #00ffff
color7  = #e5e5e5
color15 = #ffffff
