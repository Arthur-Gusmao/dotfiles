[child]
program=ash

[window]
opacity=255

margin=yes

decorations=auto

[terminal]
rows=16
columns=140

scrollback=1000

scroll to bottom on input=no

[font]
size=24

path=/usr/share/fonts/nerd-iosevka-term/IosevkaTermNerdFont-Regular.ttf

[bind]
C-S-c=copy
C-S-v=paste
C-S-r=reset
C-S-Delete=hard reset
C-S-j=scroll down
C-S-k=scroll up
C-S-Page_Down=scroll down page
C-S-Page_Up=scroll up page
C-S-End=scroll to bottom
C-S-Home=scroll to top

[colors]
foreground = #e6e1dc
background = #060a07

color0  = #060a07
color8  = #5a647e

color1  = #da4939
color9  = #da6b5f

color2  = #a5c261
color10 = #abc277

color3  = #ffc66d
color11 = #ffd99e

color4  = #6d9cbe
color12 = #94acbe

color5  = #b6b3eb
color13 = #d2d0eb

color6  = #519f50
color14 = #6a9f69

color7  = #e6e1dc
color15 = #f9f4eb


