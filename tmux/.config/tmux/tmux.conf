##### ------------------------------------------------------------------------
##### Terminal
##### ------------------------------------------------------------------------

set -g terminal-features "tmux-256color:RGB"
set -g set-clipboard on

##### ------------------------------------------------------------------------
##### General
##### ------------------------------------------------------------------------

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g mode-keys vi
set -g escape-time 0
set -g destroy-unattached off

##### ------------------------------------------------------------------------
##### Colors (gruvbox dark)
##### ------------------------------------------------------------------------

BG="#282828"
FG="#ebdbb2"

SURFACE="#3c3836"

ACCENT="#83a598"
ACCENT2="#fbf1c7"

MUTED="#928374"
BORDER="#665c54"

ERROR="#fb4934"

##### ------------------------------------------------------------------------
##### Nerd Font Icons
##### ------------------------------------------------------------------------

TRIANGLE_OPEN="#(printf '\uE0BC')"
TRIANGLE_CLOSE="#(printf '\uE0BA')"

##### ------------------------------------------------------------------------
##### Copy Mode
##### ------------------------------------------------------------------------

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind -T copy-mode-vi MouseDragEnd1Pane

##### ------------------------------------------------------------------------
##### Status Bar
##### ------------------------------------------------------------------------

set -g status-position top
set -g status-style "bg=${BG},fg=${FG}"
set -g status-justify absolute-centre

set -g status-left-length 100
set -g status-right-length 100

set -g status-left "\
#[bg=${SURFACE},fg=${ACCENT2}] #S \
#[bg=${BG},fg=${SURFACE}]${TRIANGLE_OPEN}"

set -g status-right "\
#[bg=${BG},fg=${SURFACE}]${TRIANGLE_CLOSE}\
#[bg=${SURFACE},fg=${FG}] #h "

##### ------------------------------------------------------------------------
##### Windows
##### ------------------------------------------------------------------------

set -g window-status-style "fg=${MUTED}"

set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"

set -g window-status-current-style "fg=${ACCENT2},bold"

set -g window-status-bell-style "fg=${ERROR},bold"

##### ------------------------------------------------------------------------
##### Messages
##### ------------------------------------------------------------------------

set -g message-style "bg=${SURFACE},fg=${FG}"
set -g mode-style "bg=${BORDER},fg=${ACCENT2}"

##### ------------------------------------------------------------------------
##### Panes
##### ------------------------------------------------------------------------

set -g pane-border-lines simple
set -g pane-border-style "fg=${BORDER}"
set -g pane-active-border-style "fg=${ACCENT}"

##### ------------------------------------------------------------------------
##### Prefix
##### ------------------------------------------------------------------------

unbind C-b
set -g prefix `
bind ` send-prefix

##### ------------------------------------------------------------------------
##### Splits
##### ------------------------------------------------------------------------

unbind %
unbind '"'

bind h split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

bind v split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### ------------------------------------------------------------------------
##### Utilities
##### ------------------------------------------------------------------------

bind E show-environment -g

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind-key x kill-pane

##### ------------------------------------------------------------------------
##### Navigation
##### ------------------------------------------------------------------------

bind -n M-H previous-window
bind -n M-L next-window

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

##### ------------------------------------------------------------------------
##### Session Popup
##### ------------------------------------------------------------------------

unbind n

bind n display-popup -E \
'sh -c "printf \"Session name: \"; read name; tmux new-session -d -s \"$name\" && tmux switch-client -t \"$name\""'

##### ------------------------------------------------------------------------
##### Shell Popup
##### ------------------------------------------------------------------------

unbind t

bind t display-popup \
-d "#{pane_current_path}" \
-E "yash"
